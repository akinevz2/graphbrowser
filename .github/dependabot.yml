version: 2
updates:
  - package-ecosystem: npm
    directory: "/src/main/webui"
    schedule:
      interval: weekly
    groups:
      npm_and_yarn:
        patterns:
          - "*"
    ignore:
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-router-dom"
        update-types:
          - "version-update:semver-major"
